name: Build Matching Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      match_spec:
        description: "输入匹配字符串 (如 RAK_4631)"
        required: true
        default: "RAK_4631"
  push:
    tags:
      - "matching-*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment


      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-matching-firmwares "${{ github.event.inputs.match_spec }}"


      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matching-firmwares
          path: out

      - name: Create Release (Tag Trigger Only)
        if: startsWith(github.ref, 'refs/tags/matching-')
        uses: softprops/action-gh-release@v2
        with:
          name: "Matching Firmwares: ${{ steps.determine-spec.outputs.MATCH_SPEC }}"
          body: "Built all firmwares matching ${{ steps.determine-spec.outputs.MATCH_SPEC }}"
          draft: true
          files: out/*
